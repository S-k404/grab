name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Grab and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run platform and offline tests
        run: python -m pytest -q tests/test_win32_compat.py tests/test_queue.py tests/test_schedule.py tests/test_ui.py tests/test_formats.py tests/test_web.py -p no:cacheprovider
